<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TR大阪 AI提案ツール</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; background: #f5f5f5; color: #333; }
  .container { max-width: 800px; margin: 0 auto; padding: 20px; }
  header { background: #1a3a5c; color: white; padding: 16px 20px; margin-bottom: 20px; border-radius: 8px; }
  header h1 { font-size: 20px; font-weight: bold; }
  header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .menu-btn { background: white; border: 2px solid #ddd; border-radius: 8px; padding: 16px; cursor: pointer; text-align: left; transition: all 0.2s; }
  .menu-btn:hover { border-color: #1a3a5c; }
  .menu-btn.active { border-color: #1a3a5c; background: #eef3f8; }
  .menu-btn .icon { font-size: 24px; margin-bottom: 8px; }
  .menu-btn h3 { font-size: 14px; font-weight: bold; color: #1a3a5c; margin-bottom: 4px; }
  .menu-btn p { font-size: 12px; color: #666; line-height: 1.4; }
  .panel { background: white; border-radius: 8px; padding: 20px; display: none; }
  .panel.active { display: block; }
  .panel h2 { font-size: 16px; font-weight: bold; color: #1a3a5c; margin-bottom: 16px; border-bottom: 2px solid #eef3f8; padding-bottom: 8px; }
  .chat-messages { height: 400px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 16px; margin-bottom: 12px; background: #fafafa; }
  .message { margin-bottom: 12px; }
  .message.user { text-align: right; }
  .message.ai { text-align: left; }
  .bubble { display: inline-block; max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  .message.user .bubble { background: #1a3a5c; color: white; border-bottom-right-radius: 4px; }
  .message.ai .bubble { background: #eef3f8; color: #333; border-bottom-left-radius: 4px; }
  .input-row { display: flex; gap: 8px; }
  .input-row input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
  .input-row input:focus { border-color: #1a3a5c; }
  .input-row button { padding: 10px 20px; background: #1a3a5c; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .input-row button:hover { background: #2a5a8c; }
  .input-row button:disabled { background: #999; cursor: not-allowed; }
  .coming-soon { text-align: center; padding: 40px 20px; color: #999; }
  .coming-soon .icon { font-size: 48px; margin-bottom: 12px; }
  .coming-soon p { font-size: 14px; }
  .form-section { margin-bottom: 16px; }
  .form-section label { display: block; font-size: 13px; font-weight: bold; color: #1a3a5c; margin-bottom: 6px; }
  .form-row { display: flex; align-items: center; gap: 8px; }
  .form-row input[type="number"] { width: 100px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
  .form-row input[type="number"]:focus { border-color: #1a3a5c; }
  .form-row span { font-size: 13px; color: #666; }
  .form-section textarea { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; resize: vertical; min-height: 80px; font-family: inherit; }
  .form-section textarea:focus { border-color: #1a3a5c; }
  .suggest-results { margin-top: 16px; border: 1px solid #eee; border-radius: 8px; padding: 16px; background: #fafafa; min-height: 100px; font-size: 14px; line-height: 1.8; white-space: pre-wrap; display: none; }
  .suggest-results.active { display: block; }
  .form-btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .form-btn-row button { padding: 10px 24px; background: #1a3a5c; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .form-btn-row button:hover { background: #2a5a8c; }
  .form-btn-row button:disabled { background: #999; cursor: not-allowed; }
  .form-btn-row .reset-btn { background: #888; }
  .form-btn-row .reset-btn:hover { background: #666; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>TR大阪 AI提案ツール</h1>
    <p>過去実績DBをもとにアイテム提案・仕入先検索を自動化します</p>
  </header>

  <div class="menu-grid">
    <button class="menu-btn active" onclick="showPanel('chat', this)">
      <div class="icon">💬</div>
      <h3>一問一答</h3>
      <p>商品の価格感や仕入先を気軽に質問</p>
    </button>
    <button class="menu-btn" onclick="showPanel('suggest', this)">
      <div class="icon">✨</div>
      <h3>アイテム提案</h3>
      <p>予算・条件からアイテムをピックアップ</p>
    </button>
    <button class="menu-btn" onclick="showPanel('supplier', this)">
      <div class="icon">🏭</div>
      <h3>仕入先検索</h3>
      <p>商品カテゴリから仕入先と概算を検索</p>
    </button>
    <button class="menu-btn" onclick="showPanel('report', this)">
      <div class="icon">📊</div>
      <h3>実績資料</h3>
      <p>直近の決定商品データをまとめる</p>
    </button>
  </div>

  <div class="panel active" id="panel-chat">
    <h2>💬 一問一答</h2>
    <div class="chat-messages" id="chatMessages">
      <div class="message ai">
        <div class="bubble">こんにちは！過去の実績DBをもとに質問に答えます。商品の価格感、仕入先、実績件数など気軽に聞いてください。

例：「タオルの仕入先と売単価は？」「アクリルスタンドの実績は？」「エコバッグの粗利率は？」</div>
      </div>
    </div>
    <div class="input-row">
      <input type="text" id="chatInput" placeholder="質問を入力してください..." onkeydown="if(event.key==='Enter')sendChat()" />
      <button onclick="sendChat()" id="sendBtn">送信</button>
    </div>
  </div>

  <div class="panel" id="panel-suggest">
    <h2>✨ アイテム提案</h2>

    <div class="form-section">
      <label>仕入単価（円）</label>
      <div class="form-row">
        <input type="number" id="suggestCostMin" placeholder="下限" min="0" />
        <span>〜</span>
        <input type="number" id="suggestCostMax" placeholder="上限" min="0" />
        <span>円</span>
      </div>
    </div>

    <div class="form-section">
      <label>数量（個）</label>
      <div class="form-row">
        <input type="number" id="suggestQtyMin" placeholder="下限" min="0" />
        <span>〜</span>
        <input type="number" id="suggestQtyMax" placeholder="上限" min="0" />
        <span>個</span>
      </div>
    </div>

    <div class="form-section">
      <label>テーマ・条件</label>
      <textarea id="suggestTheme" placeholder="ターゲット・季節感・用途・企画テーマなどを入力&#10;例：夏向けのノベルティ、アニメイベントのグッズ、エコ意識高い企業向け、30代女性向け"></textarea>
    </div>

    <div class="form-btn-row">
      <button onclick="sendSuggest('search')" id="suggestSearchBtn">条件で絞り込む</button>
      <button onclick="sendSuggest('idea')" id="suggestIdeaBtn">アイデアを出す</button>
      <button onclick="resetSuggest()" class="reset-btn">リセット</button>
    </div>

    <div class="suggest-results" id="suggestResults"></div>
  </div>

  <div class="panel" id="panel-supplier">
    <h2>🏭 仕入先検索</h2>
    <div class="chat-messages" id="supplierMessages">
      <div class="message ai">
        <div class="bubble">仕入先を調べたい商品名・仕様を入力してください。裏取りDBから仕入先候補と仕様・コスト情報を出します。

例：「アクリルスタンド」「フェイスタオル 刺繍あり」「エコバッグ 不織布」</div>
      </div>
    </div>
    <div class="input-row">
      <input type="text" id="supplierInput" placeholder="商品名・仕様を入力してください..." onkeydown="if(event.key==='Enter')sendSupplier()" />
      <button onclick="sendSupplier()" id="supplierBtn">検索</button>
      <button onclick="resetSupplier()" id="supplierResetBtn" style="background:#888;">新しく検索</button>
    </div>
  </div>

  <div class="panel" id="panel-report">
    <h2>📊 実績を調べる</h2>

    <div class="form-section">
      <label>売単価（円）</label>
      <div class="form-row">
        <input type="number" id="reportPriceMin" placeholder="下限" min="0" />
        <span>〜</span>
        <input type="number" id="reportPriceMax" placeholder="上限" min="0" />
        <span>円</span>
      </div>
    </div>

    <div class="form-section">
      <label>数量（個）</label>
      <div class="form-row">
        <input type="number" id="reportQtyMin" placeholder="下限" min="0" />
        <span>〜</span>
        <input type="number" id="reportQtyMax" placeholder="上限" min="0" />
        <span>個</span>
      </div>
    </div>

    <div class="form-section">
      <label>業界・テーマ・条件</label>
      <textarea id="reportTheme" placeholder="業界・顧客ターゲット・商品ジャンルなどを入力&#10;例：アニメ・ライブグッズ、食品メーカーノベルティ、スポーツ関連、30代女性向け"></textarea>
    </div>

    <div class="form-btn-row">
      <button onclick="sendReport()" id="reportBtn">実績を検索</button>
      <button onclick="resetReport()" class="reset-btn">リセット</button>
    </div>

    <div class="suggest-results" id="reportResults"></div>
  </div>
</div>

<script>
const WORKER_URL = "https://tr-notion-proxy.osk-trans52.workers.dev";
const KETTEI_DB_ID = "360562954f43813f8594fbe03f95a8e8";
const URATORI_DB_ID = "367562954f4381ccbdc2de32ac92f2b5";

// 会話履歴を保持する配列（最大10往復まで）
var chatHistory = [];

// AIの回答をHTMLに変換（マークダウンを見やすく表示）
function formatAnswer(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') // XSS対策
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')  // **太字**
    .replace(/\*(.+?)\*/g, '$1')                        // *斜体* → 記号だけ除去
    .replace(/^#{1,3}\s+(.+)$/gm, '<strong>$1</strong>') // # 見出し → 太字
    .replace(/\n/g, '<br>');                             // 改行
}

function showPanel(id, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
  btn.classList.add('active');
}

// ▼▼▼ ここが今回の修正ポイント ▼▼▼
function extractKeywords(question) {
  // 数字・単位・助詞・動詞などを除去
  var kw = question
    .replace(/[０-９0-9]+/g, ' ')           // 数字を除去（1000, １０００など）
    .replace(/[ヶヵ個枚本冊セット点式台台件]/g, ' ')  // 数量の単位を除去
    .replace(/程度|以上|以下|以内|くらい|ぐらい/g, ' ') // 曖昧な数量表現を除去
    .replace(/[？?！!。、「」『』・]/g, ' ')   // 句読点・記号を除去
    .replace(/決定商品|裏取り|データベース/g, ' ')
    .replace(/から|最近|情報|出して|教えて|ください|について|とは|どこ|いくら|どんな/g, ' ')
    .replace(/仕入れ|仕入|コスト|単価|価格|金額|費用/g, ' ') // 価格系の言葉を除去（商品名だけ残す）
    .replace(/の|は|を|に|で|が|と|まで|も|や/g, ' ');

  // 空白で分割して2文字以上の単語だけ残す
  var words = kw.trim().split(/\s+/).filter(function(w) { return w.length >= 2; });

  // 重複を除去して返す
  return [...new Set(words)];
}
// ▲▲▲ 修正ここまで ▲▲▲

async function searchNotionDB(dbId, kw, opts) {
  // opts = { cost_min, cost_max, qty_min, qty_max }
  opts = opts || {};
  try {
    var body = { database_id: dbId, keyword: kw };
    if (opts.cost_min !== undefined) body.cost_min = opts.cost_min;
    if (opts.cost_max !== undefined) body.cost_max = opts.cost_max;
    if (opts.qty_min !== undefined) body.qty_min = opts.qty_min;
    if (opts.qty_max !== undefined) body.qty_max = opts.qty_max;
    var response = await fetch(WORKER_URL + '/notion/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    var data = await response.json();
    return data.results || [];
  } catch (e) {
    return [];
  }
}

function pageToText(page, type) {
  var p = page.properties;
  if (type === 'kettei') {
    var name = (p['商材名'] && p['商材名'].title && p['商材名'].title[0]) ? p['商材名'].title[0].text.content : '';
    var price = (p['売単価'] && p['売単価'].number) ? p['売単価'].number : '';
    var cat = (p['カテゴリ'] && p['カテゴリ'].select) ? p['カテゴリ'].select.name : '';
    var sup = (p['仕入先'] && p['仕入先'].rich_text && p['仕入先'].rich_text[0]) ? p['仕入先'].rich_text[0].text.content : '';
    var qty = (p['数量'] && p['数量'].number) ? p['数量'].number : '';
    var margin = (p['粗利率'] && p['粗利率'].number) ? Math.round(p['粗利率'].number * 100) + '%' : '';
    var date = (p['納期'] && p['納期'].date) ? p['納期'].date.start : '';
    return '[受注実績] 商材名:' + name + ' カテゴリ:' + cat + ' 売単価:' + price + '円 数量:' + qty + ' 粗利率:' + margin + ' 仕入先:' + sup + ' 納期:' + date;
  } else {
    var name2 = (p['商品名'] && p['商品名'].title && p['商品名'].title[0]) ? p['商品名'].title[0].text.content : '';
    var sup2 = (p['仕入先'] && p['仕入先'].rich_text && p['仕入先'].rich_text[0]) ? p['仕入先'].rich_text[0].text.content : '';
    var cost = (p['仕入単価'] && p['仕入単価'].number) ? p['仕入単価'].number : '';
    var cat2 = (p['商品分類'] && p['商品分類'].select) ? p['商品分類'].select.name : '';
    var qty2 = (p['数量'] && p['数量'].number) ? p['数量'].number : '';
    var schedule = (p['スケジュール'] && p['スケジュール'].rich_text && p['スケジュール'].rich_text[0]) ? p['スケジュール'].rich_text[0].text.content : '';
    return '[仕入情報] 商品名:' + name2 + ' 分類:' + cat2 + ' 仕入先:' + sup2 + ' 数量:' + qty2 + '個 仕入単価:' + cost + '円 スケジュール:' + schedule;
  }
}

async function sendChat() {
  var input = document.getElementById('chatInput');
  var question = input.value.trim();
  if (!question) return;
  var messages = document.getElementById('chatMessages');
  var sendBtn = document.getElementById('sendBtn');

  messages.innerHTML += '<div class="message user"><div class="bubble">' + question + '</div></div>';
  input.value = '';
  sendBtn.disabled = true;

  var loadingId = 'loading-' + Date.now();
  messages.innerHTML += '<div class="message ai" id="' + loadingId + '"><div class="bubble">🔍 DBを検索中...</div></div>';
  messages.scrollTop = messages.scrollHeight;

  try {
    // ▼▼▼ ここも修正：キーワードを複数使って検索 ▼▼▼
    var keywords = extractKeywords(question);
    var primaryKeyword = keywords[0] || '';

    // 1回目：メインキーワードで検索
    var results = await Promise.all([
      searchNotionDB(KETTEI_DB_ID, primaryKeyword).then(function(r) { return { type: 'kettei', results: r }; }),
      searchNotionDB(URATORI_DB_ID, primaryKeyword).then(function(r) { return { type: 'uratori', results: r }; })
    ]);

    var totalHits = results[0].results.length + results[1].results.length;

    // ヒット0件の場合、2番目のキーワードでリトライ
    if (totalHits === 0 && keywords.length > 1) {
      results = await Promise.all([
        searchNotionDB(KETTEI_DB_ID, keywords[1]).then(function(r) { return { type: 'kettei', results: r }; }),
        searchNotionDB(URATORI_DB_ID, keywords[1]).then(function(r) { return { type: 'uratori', results: r }; })
      ]);
    }
    // ▲▲▲ 修正ここまで ▲▲▲

    var allData = [];
    for (var i = 0; i < results.length; i++) {
      var items = results[i].results.slice(0, 10);
      for (var j = 0; j < items.length; j++) {
        allData.push(pageToText(items[j], results[i].type));
      }
    }

    var notionContext = allData.length > 0 ? allData.join('\n') : 'データが見つかりませんでした';

    var res = await fetch(WORKER_URL + '/gemini/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: question, notionContext: notionContext, history: chatHistory })
    });
    var data = await res.json();
    var answer = data.answer || 'エラーが発生しました。';

    // 会話履歴に追加（最大10往復＝20件まで保持）
    chatHistory.push({ role: 'user', content: question });
    chatHistory.push({ role: 'assistant', content: answer });
    if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);

    document.getElementById(loadingId).remove();
    messages.innerHTML += '<div class="message ai"><div class="bubble">' + formatAnswer(answer) + '</div></div>';
  } catch (e) {
    document.getElementById(loadingId).remove();
    messages.innerHTML += '<div class="message ai"><div class="bubble">エラー: ' + e.message + '</div></div>';
  }

  sendBtn.disabled = false;
  messages.scrollTop = messages.scrollHeight;
}

// 仕入先検索の状態管理
var supplierHistory = [];      // 会話履歴
var supplierAllResults = [];   // Notionから取得した全件データ（最大100件）
var supplierShownCount = 0;    // 現在Geminiに渡した件数
var SUPPLIER_PAGE_SIZE = 15;   // 1回に渡す件数

function resetSupplier() {
  supplierHistory = [];
  supplierAllResults = [];
  supplierShownCount = 0;
  var messages = document.getElementById('supplierMessages');
  messages.innerHTML = '<div class="message ai"><div class="bubble">仕入先を調べたい商品名・仕様を入力してください。裏取りDBから仕入先候補と仕様・コスト情報を出します。\n\n例：「アクリルスタンド」「フェイスタオル 刺繍あり」「エコバッグ 不織布」</div></div>';
  document.getElementById('supplierInput').value = '';
}

// 「もっとちょうだい」系のキーワード判定
function isMoreRequest(question) {
  return /もっと|追加|他に|ほか|まだある|さらに|もう少し/.test(question);
}

async function sendSupplier() {
  var input = document.getElementById('supplierInput');
  var question = input.value.trim();
  if (!question) return;
  var messages = document.getElementById('supplierMessages');
  var btn = document.getElementById('supplierBtn');

  messages.innerHTML += '<div class="message user"><div class="bubble">' + question + '</div></div>';
  input.value = '';
  btn.disabled = true;

  var loadingId = 'loading-' + Date.now();
  messages.scrollTop = messages.scrollHeight;

  try {
    var notionContext = '';

    // 「もっとちょうだい」の場合：次の15件を追加
    if (isMoreRequest(question) && supplierAllResults.length > 0) {
      messages.innerHTML += '<div class="message ai" id="' + loadingId + '"><div class="bubble">🔍 追加データを取得中...</div></div>';
      var nextItems = supplierAllResults.slice(supplierShownCount, supplierShownCount + SUPPLIER_PAGE_SIZE);
      if (nextItems.length === 0) {
        document.getElementById(loadingId).remove();
        messages.innerHTML += '<div class="message ai"><div class="bubble">これ以上データはありません。「新しく検索」ボタンで別の商品を検索できます。</div></div>';
        btn.disabled = false;
        messages.scrollTop = messages.scrollHeight;
        return;
      }
      notionContext = nextItems.map(function(r) { return pageToText(r, 'uratori'); }).join('\n');
      supplierShownCount += nextItems.length;

    // 初回 or 通常の追加質問：保持データをそのまま使う
    } else if (supplierAllResults.length > 0) {
      messages.innerHTML += '<div class="message ai" id="' + loadingId + '"><div class="bubble">💬 回答を生成中...</div></div>';
      // 保持済みデータの先頭15件をそのまま使う（再検索しない）
      notionContext = supplierAllResults.slice(0, supplierShownCount).map(function(r) { return pageToText(r, 'uratori'); }).join('\n');

    // 初回検索
    } else {
      messages.innerHTML += '<div class="message ai" id="' + loadingId + '"><div class="bubble">🔍 裏取りDBを検索中...</div></div>';
      var keywords = extractKeywords(question);
      var primaryKeyword = keywords[0] || '';
      var results = await searchNotionDB(URATORI_DB_ID, primaryKeyword);
      if (results.length === 0 && keywords.length > 1) {
        results = await searchNotionDB(URATORI_DB_ID, keywords[1]);
      }
      supplierAllResults = results;  // 全件保持
      var firstItems = results.slice(0, SUPPLIER_PAGE_SIZE);
      supplierShownCount = firstItems.length;
      notionContext = firstItems.map(function(r) { return pageToText(r, 'uratori'); }).join('\n');
      if (!notionContext) notionContext = 'データが見つかりませんでした';
    }

    var res = await fetch(WORKER_URL + '/gemini/supplier', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: question, notionContext: notionContext, history: supplierHistory })
    });
    var data = await res.json();
    var answer = data.answer || 'エラーが発生しました。';

    supplierHistory.push({ role: 'user', content: question });
    supplierHistory.push({ role: 'assistant', content: answer });
    if (supplierHistory.length > 20) supplierHistory = supplierHistory.slice(-20);

    document.getElementById(loadingId).remove();
    // 残件数を表示
    var remaining = supplierAllResults.length - supplierShownCount;
    var remainingMsg = remaining > 0 ? '\n\n（他に' + remaining + '件のデータがあります。「もっと見せて」と入力してください）' : '';
    messages.innerHTML += '<div class="message ai"><div class="bubble">' + formatAnswer(answer) + remainingMsg + '</div></div>';

  } catch (e) {
    document.getElementById(loadingId).remove();
    messages.innerHTML += '<div class="message ai"><div class="bubble">エラー: ' + e.message + '</div></div>';
  }

  btn.disabled = false;
  messages.scrollTop = messages.scrollHeight;
}

// アイテム提案
function resetSuggest() {
  document.getElementById('suggestCostMin').value = '';
  document.getElementById('suggestCostMax').value = '';
  document.getElementById('suggestQtyMin').value = '';
  document.getElementById('suggestQtyMax').value = '';
  document.getElementById('suggestTheme').value = '';
  var results = document.getElementById('suggestResults');
  results.classList.remove('active');
  results.innerHTML = '';
}

// アイテム提案の状態管理
var suggestAllData = [];   // 全件保持
var suggestShownCount = 0; // 現在Geminiに渡した件数
var SUGGEST_PAGE_SIZE = 30;

async function sendSuggest(mode) {
  var costMin = document.getElementById('suggestCostMin').value;
  var costMax = document.getElementById('suggestCostMax').value;
  var qtyMin = document.getElementById('suggestQtyMin').value;
  var qtyMax = document.getElementById('suggestQtyMax').value;
  var theme = document.getElementById('suggestTheme').value.trim();

  if (!costMin && !costMax && !qtyMin && !qtyMax && !theme) {
    alert('条件を1つ以上入力してください。');
    return;
  }

  var searchBtn = document.getElementById('suggestSearchBtn');
  var ideaBtn = document.getElementById('suggestIdeaBtn');
  var results = document.getElementById('suggestResults');
  searchBtn.disabled = true;
  ideaBtn.disabled = true;
  results.classList.add('active');
  results.innerHTML = '🔍 DBを検索中...';

  // 条件テキスト生成
  var conditions = [];
  if (costMin && costMax) conditions.push('仕入単価' + costMin + '円〜' + costMax + '円');
  else if (costMin) conditions.push('仕入単価' + costMin + '円以上');
  else if (costMax) conditions.push('仕入単価' + costMax + '円以下');
  if (qtyMin && qtyMax) conditions.push('数量' + qtyMin + '個〜' + qtyMax + '個');
  else if (qtyMin) conditions.push('数量' + qtyMin + '個以上');
  else if (qtyMax) conditions.push('数量' + qtyMax + '個以下');
  if (theme) conditions.push('テーマ・条件：' + theme);
  var conditionText = conditions.join('、');

  try {
    // 数値条件でNotion側フィルター
    var numOpts = {};
    if (costMin) numOpts.cost_min = parseFloat(costMin);
    if (costMax) numOpts.cost_max = parseFloat(costMax);
    if (qtyMin) numOpts.qty_min = parseInt(qtyMin);
    if (qtyMax) numOpts.qty_max = parseInt(qtyMax);

    // 両DBを検索・全件保持
    var ketteiResults = await searchNotionDB(KETTEI_DB_ID, '', numOpts);
    var uratoriResults = await searchNotionDB(URATORI_DB_ID, '', numOpts);

    suggestAllData = [];
    uratoriResults.forEach(function(r) { suggestAllData.push({ text: pageToText(r, 'uratori'), src: '裏取りDB' }); });
    ketteiResults.forEach(function(r) { suggestAllData.push({ text: pageToText(r, 'kettei'), src: '決定商品DB' }); });
    suggestShownCount = Math.min(SUGGEST_PAGE_SIZE, suggestAllData.length);

    var notionContext = suggestAllData.slice(0, suggestShownCount)
      .map(function(d) { return '[' + d.src + '] ' + d.text; }).join('\n');
    if (!notionContext) notionContext = 'データが見つかりませんでした';

    var res = await fetch(WORKER_URL + '/gemini/suggest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conditions: conditionText, notionContext: notionContext, mode: mode })
    });
    var data = await res.json();

    var remaining = suggestAllData.length - suggestShownCount;
    var remainingMsg = remaining > 0 ? '\n\n（他に' + remaining + '件あります。「もっと見せて」で追加表示できます）' : '';
    results.innerHTML = formatAnswer(data.answer || 'エラーが発生しました。') + remainingMsg;

  } catch (e) {
    results.innerHTML = 'エラー: ' + e.message;
  }

  searchBtn.disabled = false;
  ideaBtn.disabled = false;
}

// 実績を調べる
function resetReport() {
  document.getElementById('reportPriceMin').value = '';
  document.getElementById('reportPriceMax').value = '';
  document.getElementById('reportQtyMin').value = '';
  document.getElementById('reportQtyMax').value = '';
  document.getElementById('reportTheme').value = '';
  var results = document.getElementById('reportResults');
  results.classList.remove('active');
  results.innerHTML = '';
}

async function sendReport() {
  var priceMin = document.getElementById('reportPriceMin').value;
  var priceMax = document.getElementById('reportPriceMax').value;
  var qtyMin = document.getElementById('reportQtyMin').value;
  var qtyMax = document.getElementById('reportQtyMax').value;
  var theme = document.getElementById('reportTheme').value.trim();

  if (!priceMin && !priceMax && !qtyMin && !qtyMax && !theme) {
    alert('条件を1つ以上入力してください。');
    return;
  }

  var btn = document.getElementById('reportBtn');
  var results = document.getElementById('reportResults');
  btn.disabled = true;
  results.classList.add('active');
  results.innerHTML = '🔍 決定商品DBを検索中...';

  // 条件テキスト生成
  var conditions = [];
  if (priceMin && priceMax) conditions.push('売単価' + priceMin + '円〜' + priceMax + '円');
  else if (priceMin) conditions.push('売単価' + priceMin + '円以上');
  else if (priceMax) conditions.push('売単価' + priceMax + '円以下');
  if (qtyMin && qtyMax) conditions.push('数量' + qtyMin + '個〜' + qtyMax + '個');
  else if (qtyMin) conditions.push('数量' + qtyMin + '個以上');
  else if (qtyMax) conditions.push('数量' + qtyMax + '個以下');
  if (theme) conditions.push('テーマ・条件：' + theme);
  var conditionText = conditions.join('、');

  try {
    // 数値条件でWorker側フィルター
    var numOpts = {};
    if (priceMin) numOpts.cost_min = parseFloat(priceMin);
    if (priceMax) numOpts.cost_max = parseFloat(priceMax);
    if (qtyMin) numOpts.qty_min = parseInt(qtyMin);
    if (qtyMax) numOpts.qty_max = parseInt(qtyMax);

    // テーマからキーワード抽出（商品ジャンル絞り込み用）
    var keywords = theme ? extractKeywords(theme) : [];
    var primaryKeyword = keywords[0] || '';

    // 決定商品DBを数値条件＋キーワードで検索
    var ketteiResults = await searchNotionDB(KETTEI_DB_ID, primaryKeyword, numOpts);
    var allData = ketteiResults.slice(0, 30).map(function(r) { return pageToText(r, 'kettei'); });
    var notionContext = allData.length > 0 ? allData.join('\n') : 'データが見つかりませんでした';

    var res = await fetch(WORKER_URL + '/gemini/report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conditions: conditionText, notionContext: notionContext })
    });
    var data = await res.json();
    results.innerHTML = formatAnswer(data.answer || 'エラーが発生しました。');

  } catch (e) {
    results.innerHTML = 'エラー: ' + e.message;
  }

  btn.disabled = false;
}
</script>
